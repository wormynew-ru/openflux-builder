name: Build OpenFlux Android Client

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenFlux
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFlux
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android NDK
        uses: nxtcoder/setup-ndk@v1
        with:
          ndk-version: 'r27b'

      - name: Run build_android.sh
        run: |
          chmod +x build_android.sh
          ./build_android.sh

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Android-Client
          path: |
            **/*.apk
            **/*.so
            openflux*
