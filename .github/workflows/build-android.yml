name: Build OpenFlux Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenFlux
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFlux
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          gomobile build -target=android -androidapi 21 -o OpenFlux-latest.apk .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Android-APK
          path: OpenFlux-latest.apk
